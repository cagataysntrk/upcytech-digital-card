name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://card.upcytech.com
          NEXT_PUBLIC_UPCYTECH_INSTAGRAM: https://www.instagram.com/upcytechcom/
          UPCY_CONTACT_CAGATAY_PHONE: +905551112233
          UPCY_CONTACT_CAGATAY_EMAIL: qa@upcytech.invalid

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          NEXT_PUBLIC_SITE_URL=https://card.upcytech.com \
          UPCY_CONTACT_CAGATAY_PHONE=+905551112233 \
          UPCY_CONTACT_CAGATAY_EMAIL=qa@upcytech.invalid \
          NEXT_PUBLIC_UPCYTECH_INSTAGRAM=https://www.instagram.com/upcytechcom/ \
          npm start > /tmp/upcy-card.log 2>&1 &
          echo $! > /tmp/upcy-card.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/upcy-card.log
          exit 1

      - name: Smoke test profile, vCard and QR
        run: |
          curl -fsS http://127.0.0.1:3000/cagatay | grep -q "Cevat Çağatay Şentürk"
          curl -fsS http://127.0.0.1:3000/api/contact/cagatay | grep -q "BEGIN:VCARD"
          curl -fsS "http://127.0.0.1:3000/api/qr/cagatay?format=svg" | grep -q "<svg"

      - name: Visual and responsive QA
        run: npm run test:e2e

      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: visual-artifacts/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/upcy-card.pid ]; then
            kill "$(cat /tmp/upcy-card.pid)" || true
          fi
